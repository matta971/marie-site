<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marie-Émeraude Alcime, mezzo-soprano</title>
    <meta name="description" content="Site officiel de Marie-Émeraude Alcime, mezzo-soprano lyrique. Opéra, oratorio, récital, agenda, presse et contact." />

    <!-- Open Graph (defaults, overridden by react-helmet-async per page) -->
    <meta property="og:site_name" content="Marie-Émeraude Alcime" />
    <meta property="og:title" content="Marie-Émeraude Alcime, mezzo-soprano" />
    <meta property="og:description" content="Site officiel de Marie-Émeraude Alcime, mezzo-soprano lyrique. Opéra, oratorio, récital, agenda, presse et contact." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://marie-emeraude.com/images/partage-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://marie-emeraude.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marie-Émeraude Alcime, mezzo-soprano" />
    <meta name="twitter:description" content="Mezzo-soprano lyrique. Opéra, oratorio, récital." />
    <meta name="twitter:image" content="https://marie-emeraude.com/images/partage-og.jpg" />

    <!-- Google Fonts - preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Le sous-domaine Pages reste servi et duplique le site sur une seconde
      // adresse. Cloudflare Pages ne sait pas le rediriger cote serveur et les
      // Redirect Rules ne s'appliquent pas a *.pages.dev, faute de zone. On le
      // fait donc ici, avant le rendu, en conservant chemin, requete et ancre.
      // La balise canonique couvre les robots ; ceci couvre les visiteurs.
      if (location.hostname === 'marie-site.pages.dev') {
        location.replace('https://marie-emeraude.com' + location.pathname + location.search + location.hash);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
